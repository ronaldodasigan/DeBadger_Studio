<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>DeBadger Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <clipPath id="ac"><circle cx="50" cy="50" r="50"></circle></clipPath>
        <clipPath id="mc"><circle cx="70" cy="134" r="53"></circle></clipPath>
        <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#F4F1F1"></stop>
          <stop offset=".35" stop-color="#C9C3C4"></stop>
          <stop offset=".6" stop-color="#EFEBEB"></stop>
          <stop offset="1" stop-color="#A29B9D"></stop>
        </linearGradient>
        <linearGradient id="metal2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E5E1E1"></stop>
          <stop offset=".5" stop-color="#9F989A"></stop>
          <stop offset="1" stop-color="#D7D2D3"></stop>
        </linearGradient>
        <linearGradient id="mir" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FAFCFE"></stop>
          <stop offset=".3" stop-color="#C6D1DA"></stop>
          <stop offset=".55" stop-color="#EEF3F7"></stop>
          <stop offset="1" stop-color="#8FA1B0"></stop>
        </linearGradient>
        <radialGradient id="gl" cx=".32" cy=".26" r=".8">
          <stop offset="0" stop-color="#fff" stop-opacity=".42"></stop>
          <stop offset=".45" stop-color="#fff" stop-opacity=".05"></stop>
          <stop offset="1" stop-color="#000" stop-opacity=".1"></stop>
        </radialGradient>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFD9B8"></stop>
          <stop offset="1" stop-color="#F7A6B0"></stop>
        </linearGradient>
      </defs>
    </svg>

    <div id="root"></div>
    <div id="modal"></div>
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="app.js" defer></script>
  </body>
</html>
